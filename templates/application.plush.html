<!DOCTYPE html>
<html lang="es" data-theme="<%= theme %>">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tareas</title>
    <link rel="stylesheet" href="/assets/app.css?v=4">
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <a href="/" class="app-brand" aria-label="Ir a la lista de tareas">
          <span>todo<span class="brand-dot" aria-hidden="true">.</span></span>
        </a>
        <nav aria-label="Principal">
          <a href="/" class="nav-link" aria-current="true">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="3" />
              <path d="m8 12 3 3 5-6" />
            </svg>
            Tareas
          </a>
        </nav>
        <form action="/theme" method="POST" class="theme-picker" data-theme-picker>
          <input type="hidden" name="authenticity_token" value="<%= authenticity_token %>">
          <label for="theme-select" class="theme-label">Fondo</label>
          <div class="theme-row">
            <select id="theme-select" name="theme" class="theme-select">
              <%= for (opt) in themes { %>
                <option value="<%= opt.Value %>"<%= if (opt.Value == theme) { %> selected<% } %>><%= opt.Label %></option>
              <% } %>
            </select>
            <button type="submit" class="button theme-apply">Aplicar</button>
          </div>
        </form>
      </aside>
      <main class="container">
        <%= partial("flash.plush.html") %>
        <%= yield %>
      </main>
    </div>
    <script src="/assets/app.js?v=3" defer></script>
  </body>
</html>
